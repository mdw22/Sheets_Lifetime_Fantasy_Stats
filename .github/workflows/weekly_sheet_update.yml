name: Weekly sheet update

on:
  schedule:
    # Cron is UTC. 14:00 UTC = 10:00 America/New_York during EDT (through Nov 1, 2026).
    # After DST ends it fires at 09:00 EST. Both are after MNF and ESPN's overnight stat
    # corrections, so the one-hour drift is acceptable.
    - cron: "0 14 * * 2"   # Tuesday
    - cron: "0 14 * * 3"   # Wednesday re-run for late stat corrections (idempotent)
  workflow_dispatch:
    inputs:
      week:
        description: "Week number (blank = latest completed week)"
        required: false
        default: ""
      commit:
        description: "Write to the sheet (unchecked = dry-run)"
        type: boolean
        default: false

concurrency:
  group: weekly-sheet-update
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run sync
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
          ESPN_LEAGUE_ID: ${{ secrets.ESPN_LEAGUE_ID }}
          ESPN_SEASON_YEAR: ${{ vars.ESPN_SEASON_YEAR }}
          GOOGLE_SHEET_ID: ${{ vars.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          INPUT_WEEK: ${{ inputs.week }}
          INPUT_COMMIT: ${{ inputs.commit }}
          EVENT_NAME: ${{ github.event_name }}
          # Kill switch: production writes happen only while repo variable SYNC_ENABLED is exactly "true".
          SYNC_ENABLED: ${{ vars.SYNC_ENABLED }}
        run: |
          args=()
          wants_write=false
          if [ "$EVENT_NAME" = "schedule" ] || [ "$INPUT_COMMIT" = "true" ]; then
            wants_write=true
          fi
          if [ "$wants_write" = "true" ] && [ "$SYNC_ENABLED" = "true" ]; then
            args+=(--commit --allow-production)
          elif [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$INPUT_COMMIT" = "true" ]; then
            msg="commit=true refused: repo variable SYNC_ENABLED is not 'true', so writes are disabled. Nothing written."
            echo "::error::$msg"
            echo "**NOTHING WRITTEN: $msg**" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          elif [ "$wants_write" = "true" ]; then
            echo "SYNC_ENABLED is not 'true': scheduled run is a dry run."
            echo "SYNC_ENABLED is not 'true': scheduled run is a dry run." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "$INPUT_WEEK" ]; then
            args+=(--week "$INPUT_WEEK")
          fi
          python -m sheet_sync "${args[@]}"

      - name: Upload backups
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sheet-backups-${{ github.run_id }}
          path: backups/
          if-no-files-found: ignore
          retention-days: 90
